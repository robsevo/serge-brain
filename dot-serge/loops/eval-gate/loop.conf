# eval-gate loop — nightly constitution regression gate + self-diagnosis.
#
# Sensor: runs the deterministic eval gate (node evals/run.mjs --gate) FIRST,
# inside build_prompt — serge is only spawned when the gate reports a
# regression, so a green night costs one cheap qwen-driven eval sweep and
# zero diagnosis tokens.
#
# Actuator: on regression, one bounded serge run reads latest.json vs baseline,
# separates genuine regressions from infra noise, writes a dated findings file,
# and appends a PROPOSAL to constitution-proposals.md. It must never edit
# CONSTITUTION*.md itself (the PreToolUse ratchet also gates that).
#
# Timer: serge-loop@eval-gate.timer (03:30 daily, Persistent=true).

LOOP_MODEL="local-coder"
LOOP_MAX_TURNS=12
LOOP_MAX_BUDGET_USD="2.00"   # nominal list-price bound; free-tier bills $0
LOOP_TIMEOUT=1200
LOOP_MAX_RUNS_PER_DAY=2

EV="$SH/evals"

build_prompt() {
  [ -f "$EV/baseline/baseline.json" ] || return 3
  [ -f "$EV/run.mjs" ] || return 3

  # The deterministic sensor: full golden-task sweep. Seat = local-coder
  # (2026-07-11 fix): the sweep MUST run on the same seat the baseline was
  # captured with (baseline.json model:null = the default driver), and
  # qwen-coder (Cerebras gpt-oss) is eval-documented to hang Claude Code's
  # agentic loop — the 2026-07-11 03:30 run timed out 9/10 tasks as infra
  # noise and burned a 19-turn diagnosis concluding exactly that.
  SERGE_EVAL_MODEL="${SERGE_GATE_MODEL:-local-coder}" \
    node "$EV/run.mjs" --gate > "$DIR/state/gate-out.txt" 2>&1
  local grc=$?
  if [ "$grc" -eq 0 ]; then
    date -u +%FT%TZ > "$DIR/state/last-green"
    return 3                       # green — nothing to diagnose, $0 spent on diagnosis
  fi

  local day; day="$(date -u +%F)"
  cat > "$PROMPT_FILE" <<EOF
You are serge's nightly eval-repair loop (headless, no human present).

The golden-task eval gate just FAILED (exit $grc). Diagnose it:

1. Read $EV/results/latest.json and $EV/baseline/baseline.json. Also read
   $DIR/state/gate-out.txt for the runner's own summary.
2. Separate GENUINE regressions (task ran, oracle failed) from INFRA noise
   (result has "error" set or run.timedOut true — router/provider problems,
   not behavior changes). Also read $SH/memory/eval-suite-noise-floor.md:
   a single rotating flake is temperature noise — re-run just that task
   (node $EV/run.mjs --task <id>) before calling it a genuine regression.
3. For each genuine regression, read its task file in $EV/tasks/ and explain
   in 2-4 sentences what behavior regressed and the most likely cause (check
   mtimes of $SH/CONSTITUTION.trimmed.v2.md, $SH/agents/*.md, $SH/council.md
   for recent edits).
4. Write your full findings to $DIR/findings-$day.md.
5. If a constitution change would fix a genuine regression, append a clearly
   marked proposal block to $SH/constitution-proposals.md. Do NOT edit any
   CONSTITUTION*.md, council.md, or agents/*.md file directly.
6. Append ONE summary line to $SH/NOTIFICATIONS.md in the form:
   "- [ ] $day eval-gate: <n> genuine / <m> infra — see loops/eval-gate/findings-$day.md"

If everything turns out to be infra noise, say so in the findings file and the
notification line, and propose nothing.
EOF
}

# ── tripwire coverage for the ACTIVE constitution (added 2026-07-28) ──────────
# run-loop.sh's default LOOP_TRIPWIRE_GLOBS still names CONSTITUTION.trimmed.v2.md.
# The brain moved to v3 (+ debugging.md) and v2 froze, so a --yolo loop could edit
# the live constitution and the kill-all-loops tripwire would not fire. loop.conf is
# sourced AFTER the defaults, so overriding here needs no change to run-loop.sh.
# Both trimmed versions listed: v2 is the documented rollback target.
LOOP_TRIPWIRE_GLOBS="$SH/CONSTITUTION.md $SH/CONSTITUTION.md $SH/CONSTITUTION.trimmed.v2.md $SH/debugging.md $SH/council.md $SH/agents/*.md $SH/commands/*.md"
