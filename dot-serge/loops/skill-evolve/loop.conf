# skill-evolve loop — nightly skill self-improvement.
#
# Sensor+actuator in one: skill-evolve.mjs is self-contained (it makes its own small model
# calls through the router), so this loop NEVER spawns a serge session — it runs the distiller
# and returns 3. Cost is a couple of cheap completions on a night with journal entries, and
# exactly zero on a quiet night.
#
# What it does: reads ~/.serge/skills/_learnings/journal.jsonl (written by the skill-learn.sh
# UserPromptSubmit capture hook) and either (a) appends the lesson to the owning SKILL.md under
# "## Learned the hard way", or (b) creates a NEW skill when a recurring need has no owner.
# Every write passes the safety gate (frontmatter + house lint + that skill's own tests) and is
# reverted if any check fails — self-improvement must never leave a skill worse.
#
# Applies to skills added in the future automatically: it enumerates the skills directory.
#
# Timer: serge-loop@skill-evolve.timer (04:15 daily, Persistent=true).

LOOP_MODEL="local-coder"
LOOP_MAX_TURNS=1
LOOP_MAX_BUDGET_USD="1.00"
LOOP_TIMEOUT=900
LOOP_MAX_RUNS_PER_DAY=1

build_prompt() {
  local journal="$SH/skills/_learnings/journal.jsonl"
  [ -s "$journal" ] || return 3          # nothing learned today — $0, no-op

  local day out rc
  day="$(date -u +%F)"
  out="$DIR/state/evolve-$day.log"
  node "$SH/skill-evolve.mjs" > "$out" 2>&1
  rc=$?

  if [ "$rc" -ne 0 ]; then
    echo "- [ ] $day skill-evolve: FAILED (exit $rc) — see loops/skill-evolve/state/evolve-$day.log" >> "$SH/NOTIFICATIONS.md"
  elif grep -qE "improved|created|REVERTED|REJECTED" "$out"; then
    echo "- [ ] $day skill-evolve: $(grep -cE '✓|✗' "$out") skill change(s) — see loops/skill-evolve/state/evolve-$day.log" >> "$SH/NOTIFICATIONS.md"
  fi
  return 3                                # never spawn a serge session
}

# ── tripwire coverage for the ACTIVE constitution (added 2026-07-28) ──────────
# run-loop.sh's default LOOP_TRIPWIRE_GLOBS still names CONSTITUTION.trimmed.v2.md.
# The brain moved to v3 (+ debugging.md) and v2 froze, so a --yolo loop could edit
# the live constitution and the kill-all-loops tripwire would not fire. loop.conf is
# sourced AFTER the defaults, so overriding here needs no change to run-loop.sh.
# Both trimmed versions listed: v2 is the documented rollback target.
LOOP_TRIPWIRE_GLOBS="$SH/CONSTITUTION.md $SH/CONSTITUTION.md $SH/CONSTITUTION.trimmed.v2.md $SH/debugging.md $SH/council.md $SH/agents/*.md $SH/commands/*.md"
