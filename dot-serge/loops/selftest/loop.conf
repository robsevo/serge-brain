# selftest loop — $0 harness check against evals/tests/stub-serge.mjs.
# Run with:
#   SERGE_LOOP_BIN="node $HOME/.serge/evals/tests/stub-serge.mjs" \
#     ~/.serge/loops/run-loop.sh selftest --now
# Proves: guards → build_prompt → invocation (prompt as final positional arg)
# → JSON parse → journal → post_run state commit. Keep DISABLED touched so
# timers can never pick it up by accident (it has no timer anyway).

LOOP_MODEL=""                 # stub ignores it; also proves empty-model path
LOOP_MAX_TURNS=1
LOOP_MAX_BUDGET_USD="0.01"
LOOP_TIMEOUT=30
LOOP_MAX_RUNS_PER_DAY=50

build_prompt() {
  rm -f "$DIR/state/marker.txt" "$DIR/state/selftest-pass"
  cat > "$PROMPT_FILE" <<'EOF'
@write marker.txt::selftest-was-here
@print {"type":"result","subtype":"success","is_error":false,"total_cost_usd":0.01,"num_turns":1,"result":"selftest ok"}
EOF
}

post_run() {
  local rc="$1"
  if [ "$rc" -eq 0 ] && grep -q "selftest-was-here" "$DIR/state/marker.txt" 2>/dev/null; then
    date -u +%FT%TZ > "$DIR/state/selftest-pass"
  fi
  return 0
}

# ── tripwire coverage for the ACTIVE constitution (added 2026-07-28) ──────────
# run-loop.sh's default LOOP_TRIPWIRE_GLOBS still names CONSTITUTION.trimmed.v2.md.
# The brain moved to v3 (+ debugging.md) and v2 froze, so a --yolo loop could edit
# the live constitution and the kill-all-loops tripwire would not fire. loop.conf is
# sourced AFTER the defaults, so overriding here needs no change to run-loop.sh.
# Both trimmed versions listed: v2 is the documented rollback target.
LOOP_TRIPWIRE_GLOBS="$SH/CONSTITUTION.md $SH/CONSTITUTION.md $SH/CONSTITUTION.trimmed.v2.md $SH/debugging.md $SH/council.md $SH/agents/*.md $SH/commands/*.md"
