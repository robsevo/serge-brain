# backlog loop — Tabarnak-style queue drain: one BACKLOG.md item per invocation.
#
# Enrolled projects live in projects.conf (one per line):
#   /abs/path/to/repo|<test command, empty = commits-only gate>|<base branch, default main>
#
# BACKLOG.md format inside each project (plain GitHub checkboxes):
#   - [ ] item to do            ← first pending, non-ledgered item wins
#     - accept: <criteria>      ← optional sub-bullets = acceptance criteria
#   - [x] done item             ← (annotation lands on the branch; merges later)
#   - [!] failed item           ← never auto-retried; human resets to "- [ ]"
#
# Safety model (why this never touches your checkout):
#   * All git happens HERE, deterministically — serge only writes code and is
#     told not to commit/push/switch branches.
#   * Work happens in a throwaway worktree on branch loop/<slug>, cut from the
#     base branch. The user's main working tree is never written to — not even
#     the checkbox: the [x]/[!] annotation is committed ON THE BRANCH, and a
#     ledger (state/done.jsonl, keyed by sha1 of project+item) prevents
#     re-picking while main's BACKLOG.md still shows "- [ ]" pre-merge.
#   * [x] requires: serge produced changes AND the test command passed in the
#     worktree AND no BLOCKED.md. Green → commit on the branch, notify, remove
#     the worktree (branch survives for review). Red → ledger FAIL, KEEP the
#     worktree for autopsy, notify.
#
# Timer: serge-loop@backlog.timer — shipped DISABLED; first runs are manual:
#   ~/.serge/loops/run-loop.sh backlog --now

LOOP_MODEL="local-coder"
LOOP_MAX_TURNS=40
LOOP_MAX_BUDGET_USD="5.00"   # nominal list-price bound; free-tier bills $0
LOOP_TIMEOUT=2400
LOOP_MAX_RUNS_PER_DAY=8

PROJECTS="$DIR/projects.conf"
LEDGER="$DIR/state/done.jsonl"
CUR="$DIR/state/current"           # per-attempt state consumed by post_run

item_sha() { printf '%s|%s' "$1" "$2" | sha1sum | cut -d' ' -f1; }
in_ledger() { [ -f "$LEDGER" ] && grep -q "\"sha\": \"$1\"" "$LEDGER"; }

build_prompt() {
  [ -f "$PROJECTS" ] || return 3
  rm -rf "$CUR"; mkdir -p "$CUR"

  local proj test_cmd base
  while IFS='|' read -r proj test_cmd base; do
    proj="${proj%"${proj##*[![:space:]]}"}"; proj="${proj#"${proj%%[![:space:]]*}"}"
    case "$proj" in ''|\#*) continue;; esac
    base="${base:-main}"
    local bl="$proj/BACKLOG.md"
    [ -f "$bl" ] || continue
    git -C "$proj" rev-parse --verify --quiet "$base" >/dev/null 2>&1 || continue

    # first pending item whose hash is not already in the ledger
    local item text sha
    while IFS= read -r item; do
      text="$(printf '%s' "$item" | sed -E 's/^[[:space:]]*- \[ \] //')"
      sha="$(item_sha "$proj" "$text")"
      in_ledger "$sha" || break
      item=""
    done < <(grep -E '^[[:space:]]*- \[ \] ' "$bl" || true)
    [ -n "${item:-}" ] || continue

    local slug wt repo
    slug="$(printf '%s' "$text" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | cut -c1-40 | sed 's/^-*//;s/-*$//')-$(date +%m%d%H%M)"
    repo="$(basename "$proj")"
    wt="$DIR/worktrees/$repo-$slug"
    mkdir -p "$DIR/worktrees"

    git -C "$proj" worktree add "$wt" -b "loop/$slug" "$base" >/dev/null 2>&1 || continue

    printf '%s\n' "$proj"      > "$CUR/proj"
    printf '%s'   "$item"      > "$CUR/item.txt"
    printf '%s'   "$text"      > "$CUR/text.txt"
    printf '%s\n' "$sha"       > "$CUR/sha"
    printf '%s\n' "$slug"      > "$CUR/slug"
    printf '%s\n' "$wt"        > "$CUR/worktree"
    printf '%s\n' "$test_cmd"  > "$CUR/test_cmd"
    printf '%s\n' "$base"      > "$CUR/base"

    LOOP_CWD="$wt"

    cat > "$PROMPT_FILE" <<EOF
You are serge's backlog loop (headless, no human present). You are in an
isolated git worktree on branch loop/$slug (base: $base) of the project
"$repo". Implement exactly ONE backlog item:

  $text

Rules:
1. Read BACKLOG.md first — indented sub-bullets under this item (if any) are
   its acceptance criteria. Build ONLY this item, nothing more.
2. Follow the project's existing conventions (read neighboring code first).
3. Verify your work as you go.${test_cmd:+ Project test command: $test_cmd}
4. Do NOT commit, do NOT push, do NOT switch branches — the loop harness
   handles git deterministically after you finish.
5. If you get blocked, write BLOCKED.md at the worktree root explaining why.
EOF
    return 0
  done < "$PROJECTS"
  return 3
}

post_run() {
  local rc="$1"
  [ -d "$CUR" ] || return 0
  local proj item text sha slug wt test_cmd base
  proj="$(cat "$CUR/proj")"; item="$(cat "$CUR/item.txt")"; text="$(cat "$CUR/text.txt")"
  sha="$(cat "$CUR/sha")"; slug="$(cat "$CUR/slug")"; wt="$(cat "$CUR/worktree")"
  test_cmd="$(cat "$CUR/test_cmd")"; base="$(cat "$CUR/base")"

  local day changed=0 trc=0 outcome mark
  day="$(date -u +%F)"
  [ -n "$(git -C "$wt" status --porcelain 2>/dev/null)" ] && changed=1
  if [ "$changed" -eq 1 ] && [ -n "$test_cmd" ]; then
    ( cd "$wt" && timeout 600 bash -c "$test_cmd" ) >> "$DIR/stderr.log" 2>&1 || trc=$?
  fi

  if [ "$rc" -eq 0 ] && [ "$changed" -eq 1 ] && [ "$trc" -eq 0 ] && [ ! -f "$wt/BLOCKED.md" ]; then
    outcome="PASS"; mark="x"
  else
    outcome="FAIL"; mark="!"
  fi

  # annotate the checkbox IN THE WORKTREE (lands on main when the branch merges)
  python3 - "$wt/BACKLOG.md" "$CUR/item.txt" "$mark" "$slug" "$day" "$outcome" 2>/dev/null <<'PY'
import sys
bl, itemf, mark, slug, day, outcome = sys.argv[1:]
item = open(itemf).read().rstrip("\n")
try: lines = open(bl).read().splitlines(keepends=True)
except FileNotFoundError: sys.exit(0)
for i, ln in enumerate(lines):
    if ln.rstrip("\n") == item:
        new = ln.rstrip("\n").replace("- [ ]", f"- [{mark}]", 1)
        new += f"  <!-- {day} serge-loop {outcome} branch=loop/{slug} -->"
        lines[i] = new + ("\n" if ln.endswith("\n") else "")
        break
open(bl, "w").write("".join(lines))
PY

  if [ "$outcome" = "PASS" ]; then
    git -C "$wt" add -A >/dev/null 2>&1
    if git -C "$wt" commit -m "backlog: $text

Implemented by the serge backlog loop (branch loop/$slug).
Tests: ${test_cmd:-none configured} → green." >/dev/null 2>&1; then
      notify_line "backlog: DONE '$text' → branch loop/$slug in $(basename "$proj") — review & merge"
      git -C "$proj" worktree remove --force "$wt" >/dev/null 2>&1 || true
    else
      outcome="FAIL"   # commit failed — keep the worktree, don't lose the work
      notify_line "backlog: '$text' built but COMMIT FAILED (git identity?) — worktree kept: $wt"
    fi
  else
    notify_line "backlog: FAILED '$text' (rc=$rc changed=$changed tests_rc=$trc$([ -f "$wt/BLOCKED.md" ] && printf ' BLOCKED')) — autopsy: $wt"
  fi

  printf '{"sha": "%s", "project": "%s", "item": "%s", "outcome": "%s", "branch": "loop/%s", "ts": "%s"}\n' \
    "$sha" "$proj" "$(printf '%s' "$text" | head -c 120 | tr '"' "'")" "$outcome" "$slug" "$(date -u +%FT%TZ)" >> "$LEDGER"
  rm -rf "$CUR"
  return 0
}

# ── tripwire coverage for the ACTIVE constitution (added 2026-07-28) ──────────
# run-loop.sh's default LOOP_TRIPWIRE_GLOBS still names CONSTITUTION.trimmed.v2.md.
# The brain moved to v3 (+ debugging.md) and v2 froze, so a --yolo loop could edit
# the live constitution and the kill-all-loops tripwire would not fire. loop.conf is
# sourced AFTER the defaults, so overriding here needs no change to run-loop.sh.
# Both trimmed versions listed: v2 is the documented rollback target.
LOOP_TRIPWIRE_GLOBS="$SH/CONSTITUTION.md $SH/CONSTITUTION.md $SH/CONSTITUTION.trimmed.v2.md $SH/debugging.md $SH/council.md $SH/agents/*.md $SH/commands/*.md"
