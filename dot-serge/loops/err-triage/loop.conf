# err-triage loop — automated triage of serge-query-errors.log.
#
# Sensor: byte-offset tail of $SH/serge-query-errors.log (the diag tripwire log
# that queryModel failures write to). No growth → return 3, costs $0. The offset
# is committed in post_run ONLY on a successful run, so a failed triage retries
# the same tail next time.
#
# Actuator: one cheap serge run classifies the new entries against the known
# interrupt causes and appends to triage-inbox.md. It NEVER writes to
# ~/.serge/memory directly — new signatures are drafted in the inbox and a
# human promotes them (guards against memory spam).
#
# Trigger: serge-loop@err-triage.path (systemd PathModified on the log — the
# log grows rarely and burstily, so an event trigger beats polling; a 10-min
# debounce + the daily cap bound burst storms, and the loop's own children
# appending errors just get triaged on the next trigger).

LOOP_MODEL="local-coder"
LOOP_MAX_TURNS=8
# NOTE: free-tier seats still REPORT nominal list-price costs (~$0.10/turn on
# Mistral Large with the constitution in context) — this cap is a runaway
# bound against those nominal numbers, not real dollars (real $ guard = the
# budget watchdog on the paid OpenRouter seats).
LOOP_MAX_BUDGET_USD="1.50"
LOOP_TIMEOUT=600
LOOP_MAX_RUNS_PER_DAY=12

ERRLOG_SRC="$SH/serge-query-errors.log"
OFFSET_FILE="$DIR/state/offset"

build_prompt() {
  [ -f "$ERRLOG_SRC" ] || return 3
  # Debounce: the path unit fires on every write; coalesce bursts.
  local last now; now=$(date +%s)
  last=$(stat -c%Y "$DIR/state/last-attempt" 2>/dev/null || echo 0)
  [ $((now - last)) -lt 600 ] && return 3
  touch "$DIR/state/last-attempt"
  local size prev
  size=$(stat -c%s "$ERRLOG_SRC" 2>/dev/null || echo 0)
  prev=$(cat "$OFFSET_FILE" 2>/dev/null || echo 0)
  case "$prev" in (*[!0-9]*|'') prev=0;; esac
  if [ "$size" -lt "$prev" ]; then echo "$size" > "$OFFSET_FILE"; return 3; fi  # log truncated/rotated
  [ "$size" -le "$prev" ] && return 3                                           # no growth

  tail -c +"$((prev + 1))" "$ERRLOG_SRC" | tail -c 20000 > "$DIR/state/new-tail.txt"
  echo "$size" > "$DIR/state/offset.pending"

  local day; day="$(date -u +%F)"
  cat > "$PROMPT_FILE" <<EOF
You are serge's error-triage loop (headless, no human present).

New entries appeared in the query-error log. Triage them:

1. Read $DIR/state/new-tail.txt (the new log tail; entries are separated by
   "----"; each has ctor/status/msg plus a stack trace).
2. Read $SH/memory/interrupts-triage.md — the canonical list of known
   interrupt classes — and classify each entry against it. Supplementary
   known causes:
   - Cause 1 — stalled SSE stream: openaiShim idle-timeout threw a plain Error
     that withRetry couldn't retry. FIXED (now APIConnectionError + reconnect);
     seeing it means the session predates the fix — needs restart.
   - Cause 2 — OpenRouter in-stream provider_unavailable relayed with HTTP 200:
     was classified unretryable. FIXED (rethrown as 503, retryable).
   - Cause 3 — poisoned tool_use ids (Kimi-style "functions.X:N" or giant
     LiteLLM parse-blob ids) → Bedrock/provider 400 on every replay. FIXED
     (id sanitizer at both shim boundaries).
   - Cause 4 — bare "API Error": non-Error rejection during cloud-brain turns
     rendered without status. The tripwire that writes this very log exists to
     identify these; a MOCK test entry ("mock invalid request for diag test")
     is expected noise — mark it as such.
   - Also known: zero-usage rows blinding autocompact → 402 context overflow.
3. Append ONE dated section to $DIR/triage-inbox.md:
   "## $day" then one bullet per entry: which cause (or NEW SIGNATURE), the
   model seat involved, and whether action is needed (usually: restart stale
   sessions for fixed causes; investigate only NEW signatures).
4. Only if an entry matches NO known cause: add a "### draft memory note"
   subsection in the inbox with name/description/fact so a human can promote it
   to ~/.serge/memory. Do NOT create or edit files under $SH/memory yourself.
5. Append ONE line to $SH/NOTIFICATIONS.md:
   "- [ ] $day err-triage: <n> new entries, <k> known / <j> new signatures — see loops/err-triage/triage-inbox.md"

Touch nothing else on the filesystem.
EOF
}

post_run() {
  local rc="$1"
  if [ "$rc" -eq 0 ] && [ -f "$DIR/state/offset.pending" ]; then
    mv "$DIR/state/offset.pending" "$OFFSET_FILE"
  fi
  return 0
}

# ── tripwire coverage for the ACTIVE constitution (added 2026-07-28) ──────────
# run-loop.sh's default LOOP_TRIPWIRE_GLOBS still names CONSTITUTION.trimmed.v2.md.
# The brain moved to v3 (+ debugging.md) and v2 froze, so a --yolo loop could edit
# the live constitution and the kill-all-loops tripwire would not fire. loop.conf is
# sourced AFTER the defaults, so overriding here needs no change to run-loop.sh.
# Both trimmed versions listed: v2 is the documented rollback target.
LOOP_TRIPWIRE_GLOBS="$SH/CONSTITUTION.md $SH/CONSTITUTION.md $SH/CONSTITUTION.trimmed.v2.md $SH/debugging.md $SH/council.md $SH/agents/*.md $SH/commands/*.md"
